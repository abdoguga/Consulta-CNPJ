# Ambiente de desenvolvimento Base44.
# Roda SEMPRE o código clonado do repositório (bind mount + comando de dev com
# live reload), nunca uma imagem pronta da aplicação.
name: consulta-cnpj

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: consulta
      POSTGRES_PASSWORD: consulta
      POSTGRES_DB: consulta_cnpj
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consulta -d consulta_cnpj"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Setup de banco (one-shot): cria as tabelas e encerra.
  migrate:
    build: ./api
    image: consulta-cnpj-api
    working_dir: /app
    volumes:
      - ./api:/app
    environment:
      - DATABASE_URL=postgresql+psycopg2://consulta:consulta@db:5432/consulta_cnpj
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.migrate"]

  api:
    build: ./api
    image: consulta-cnpj-api
    restart: on-failure
    working_dir: /app
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://consulta:consulta@db:5432/consulta_cnpj
      - BRASILAPI_BASE_URL=https://brasilapi.com.br/api
      # Passado pelo host; quando "1" ativa o polling do watcher (bind mount).
      - BASE44_PREVIEW_MODE
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      - sh
      - -ec
      - |
        if [ "$$BASE44_PREVIEW_MODE" = "1" ]; then
          export WATCHFILES_FORCE_POLLING=true
        fi
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    image: node:22
    restart: on-failure
    working_dir: /app
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
      - BASE44_PREVIEW_MODE
      # Hosts extras aceitos pelo dev server do Vite (definido pela plataforma).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      api:
        condition: service_started
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  db_data:
  web_node_modules:
